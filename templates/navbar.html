{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- dropdown icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- navbar CSS -->
    <link rel="stylesheet" href="{% static 'navbar.css'%}">
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- navbar managing JavaScript -->
    <script src="{% static 'navbar.js'%}"></script>
</head>
<body>
    <!-- authentication navbar - only shown when not logged in -->
    {% if not is_logged_in%}
    <div class="navbar-container">
        <div class="color-line" style="height: 6px;"></div>
        <nav class="navbar navbar-expand-lg navbar-light bg-white auth-navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="{% static 'img/skyHealthLogo.jpg' %}" alt="Sky Health" class="nav-logo">
                </a>
                <div class="subnav">
                    <button class="subnavbtn" id="userDropdown" for="btnControl">
                        Engineer
                        <span class="arrow-down"><i class='fa-solid fa-angle-down'></i>
                    </button>
                    <div class="subnav-content" id="roleDropdown">
                      <a class="subnav-item" href="#">Team Leader</a>
                      <a class="subnav-item" href="#">Department Leader</a>
                      <a class="subnav-item" href="#">Senior Manager</a>
                    </div>
                </div>
            </div>
        </nav>
    </div>
    {% endif %}


    <!-- main navbar - only shown when the user is logged in -->
    {% if is_logged_in %}
    <div class="navbar-container">
        <div class="color-line" style="height: 6px;"></div>
        <nav class="navbar navbar-expand-lg navbar-light bg-white">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="{% static 'img/skyHealthLogo.jpg' %}" alt="Sky Health" class="nav-logo">
                </a>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        {% if has_health_check_access %}
                        <li class="navbar-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'chooseSession' %}active{% endif %}" href="{% url 'chooseSession' %}">Health Check</a>
                        </li>
                        {% endif %}
                        <li class="navbar-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'results' %}active{% endif %}" href="{% url 'results' %}">Results</a>
                        </li>
                        <li class="navbar-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'account' %}active{% endif %}" href="{% url 'account' %}">My Account</a>
                        </li>
                        <li class="navbar-item">
                            <a class="nav-link {% if request.resolver_match.url_name == 'log_off'%}active{% endif %}" href="{% url 'log_off' %}">Log Off</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
    {% endif %}
</body>
</html>
