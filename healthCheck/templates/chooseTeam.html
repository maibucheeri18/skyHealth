{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Team</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'healthcheck.css'%}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- javascript -->
    <script src="{%static 'healthCheck.js' %}"></script>
</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>

    <main>
        <div class="container">
            
            <!-- left heading section -->
            <div class="choose-heading">
                <h1 class="choose-title">
                    Welcome to your Sky Health<br>Check!
                </h1>
                <p class="choose-description"> 
                    Help us improve by sharing your insights on our recent performance <br> and overall experience.
                </p>
            </div>
            
            <!-- team selection dropdown -->
            <div class="dropdown-container">
                <h2 class="dropdown-title">Choose your team</h2>
                <div class="chooseTeam-dropdown">
                    <div class="chooseTeam-select custom-dropdown">
                        <div id="team" class="selected-option" onclick="toggleTeamDropdown()">Select team <span id='choose-arrow-down' class="choose-arrow-down"><i class="fa-solid fa-angle-down"></i></span></div>
                        <div class="dropdown-menu" id="teamDropdown">
                            {% for team in teams %}
                                <div class="dropdown-item" onclick="selectTeam('{{team.teamId}}', '{{team.teamName}}')">
                                    <label>{{team.teamName}}</label>
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                    <input type="hidden" id="team-select" name="teamId">
                </div>

                <!-- continue button that redirects user to the startPage -->
                <a href="{% url 'startPage' %}" class="button-link">
                    <button class="chooseTeam-button" id="CT-continue-button">Continue</button>
                </a>

            </div>
        </div>
    </main>

    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
