{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Team</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'healthcheck.css'%}" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>

    <main>
        <div class="container-fluid">
            <div class="row">
                <div class="container">
                    
                    <!-- left heading section -->
                    <div class="choose-heading">
                        <h1 class="choose-title">
                            Welcome to your Sky Health<br>Check!
                        </h1>
                        <p class="choose-description"> 
                            Help us improve by sharing your insights on our recent performance <br> and overall experience.
                        </p>
                    </div>
                    
                    <!-- team selection dropdown -->
                    <div class="dropdown-container">
                        <h2 class="dropdown-title">Choose your team</h2>
                        <div class="chooseTeam-dropdown">
                            <select id="team-select" class="chooseTeam-select">
                                <option selected disabled>
                                    Select team
                                </option>
                                {% for team in teams %}
                                    <!-- dynamically populates team dropdown menu -->
                                    <option value="{{team.teamId}}">{{team.teamName}}</option>
                                {% endfor %}
                            </select>
                            <span class="choose-arrow-down"><i class="fa-solid fa-angle-down"></i></span>
                        </div>

                        <!-- continue button that redirects user to the startPage -->
                        <a href="{% url 'startPage' %}">
                            <button class="chooseTeam-button" id="CT-continue-button">Continue</button>
                        </a>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
