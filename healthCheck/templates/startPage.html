{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Check Start Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'healthcheck.css'%}" rel="stylesheet">

</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>
    <main>
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="form-container">
                        <!-- progress bar styled to be empty to indicate no questions have been answered yet -->
                        <div class="startPage-progressBar">
                            <div class="progress" style="border-radius: 10px">
                                <div class="progress-fill start-fill"></div>
                            </div>
                        </div>
                        
                        <!-- start page heading -->
                        <div class="start-heading-container">
                            <h1 class="page-heading">Cast your vote for the health check</h1>
                        </div>

                        <!-- start page button redirects user to heatlthCheckForm -->
                        <div class="start-button-container">
                            <a href="{% url 'healthCheckForm_default' %}">
                                <button class="start-button" id="start-button">
                                    Start<span class="arrow-right"><i class='fa-solid fa-angle-right'></i></span>
                                </button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>    

    </main>

    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
