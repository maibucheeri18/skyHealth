{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Check Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'healthcheck.css'%}" rel="stylesheet">
</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>

    <main>
        <div class="container-fluid">
            <div class="row">
                <div class="form-container">

                    <div class="startPage-progressBar">
                        <div class="progress" style="border-radius: 10px">
                            <div class="progress-fill start-fill"></div>
                        </div>
                    </div>
                
                    <div class="cardName-container">
                        <h1 class="card-name">Pawns or players</h1>
                    </div>

                    <div class="form-image">
                        <img src="{% static 'img/trafficLight.jpg' %}" alt="Traffic Light">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
