{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'votingForm.css'%}" rel="stylesheet">
</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>

    <main>
        <div class="container-fluid">
            <div class="row">
                <div class="form-container">

                    <!-- Start Page-->
                    <div class="progress"></div>
                    
                    <div class="heading-container">
                        <h1 class="startPage-heading">Cast your vote for the health check</h1>
                    </div>

                    <div class="button-container">
                        <button class="start-button">
                            Start<span class="arrow-right"><i class='fa-solid fa-angle-right'></i></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>    

    </main>

    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
