{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>
</head>

<body>
    <header>
        {% include 'navbar.html' %}
    </header>

    <div class="container my-5  ">
        <div class="profile-flex-container">
            
            <div class="profile-picture-container">
                <div class="avatar-container">
                    <img src="{% static 'img/profilepic.png' %}" alt="Profile">
                </div>
            </div>
    
            <div class="profile-details-container">
                <div id="form-outer-container" class="card">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-4 accountTitle">Account Details</h4>

                        
                        <form id="user-form" class="accountForm">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="first_name" class="form-label ">First name</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name }}" readonly>
                                <div class="invalid-feedback" id="first_name_error"></div>
                            </div>
    
                            <div class="mb-3">
                                <label for="last_name" class="form-label ">Last name</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name }}" readonly>
                                <div class="invalid-feedback" id="last_name_error"></div>
                            </div>
    
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" readonly>
                                <div class="invalid-feedback" id="email_error"></div>
                            </div>
    
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" readonly>
                                <div class="invalid-feedback" id="username_error"></div>
                            </div>
    
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" value="••••••••••••" readonly>
                                <div class="invalid-feedback" id="password_error"></div>
                            </div>
                            
                            <!-- Button at the bottom, centered -->
                            <div class="d-grid gap-2 mt-4">
                                <button type="button" id="action-button" class="btn btn-primary py-2">Edit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <style>
        .form-control {
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
        }
        .form-control[readonly] {
            background-color: #f8f9fa;
            opacity: 0.8;
        }
        .form-label {
        margin-bottom: 6px;
        font-size: 14px;
        color: #000FF5;
}
        .form-control.is-invalid {
            border-color: #dc3545;
            background-image: none; /* Remove Bootstrap's default validation icon */
        }
        .invalid-feedback {
    color: #dc3545;
    font-size: 12px;
    margin-top: -8px;
    margin-bottom: 10px;
}
        #action-button {
            background-color: #000FF5;
            border-color: #000FF5;
            border-radius: 4px;
            padding: 10px 0;
            font-weight: 500;
            width: 100%;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .edit-mode {
            border: 2px solid #000FF5 !important;
            border-radius: 8px !important;
        }
        
.profile-flex-container {
    display: flex;
    align-items: center; /* Center vertically */
    justify-content: center; /* Center horizontally */
    gap: 30px; /* Space between image and form */
    flex-wrap: wrap; /* Stack on smaller screens */
    background-color: #fff;
    border-radius: 8px;
    margin: auto auto 0 auto; /* Top margin and center horizontally */
    max-width: 900px; /* Limit maximum width */
}

.profile-picture-container {
    width: 458px;
    height: 444px;
    border-radius: 8px; /* slight curve if you want */
    overflow: hidden;
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
}



.avatar-container {
    width: 458px;
    height: 444px;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.avatar-container img {
    width: 458px;
    height: 444px;
    object-fit: cover;
}
.profile-details-container {
    flex: 1 1 400px; /* Allow it to grow but with base width */
    max-width: 500px; /* Set a maximum width */
}
.accountTitle{
    text-align: center;
    font-size: 24px;
    margin-bottom: 20px;
    font-weight: 600;
    background: linear-gradient(
        to right,
        rgba(255, 140, 0, 1) 0%,
        rgba(248, 0, 50, 1) 17%,
        rgba(255, 0, 160, 1) 35%,
        rgba(140, 40, 255, 1) 59%,
        rgba(0, 35, 255, 1) 76%,
        rgba(25, 160, 255, 1) 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
}
 
.container {
    max-width: 420px; /* Looks closer to your design */
    margin: 40px auto;
}

    </style>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const actionButton = document.getElementById('action-button');
            const formOuterContainer = document.getElementById('form-outer-container');
            const formInputs = document.querySelectorAll('#user-form input');
            const form = document.getElementById('user-form');
            let isEditing = false;
            
            // List of taken usernames (for simulation purposes)
            const takenUsernames = ['takenuser1', 'takenuser2', 'takenuser3', 'admin', 'user'];
    
            // Handle button click (either to edit or to save)
            actionButton.addEventListener('click', function() {
                if (isEditing) {
                    // Submit the form with validation
                    validateAndSubmit();
                } else {
                    // Enable editing mode
                    enableEditMode();
                }
            });
    
            function enableEditMode() {
                isEditing = true;
                actionButton.textContent = 'Save';
                
                // Add blue border to the outer container when in edit mode
                formOuterContainer.classList.add('edit-mode');
                
                // Clear any previous error messages
                document.querySelectorAll('.invalid-feedback').forEach(elem => {
                    elem.textContent = '';
                });
                
                // Remove error styling from inputs
                document.querySelectorAll('.is-invalid').forEach(input => {
                    input.classList.remove('is-invalid');
                });
                
                formInputs.forEach(input => {
                    if (input.id !== 'password') { // Don't make password editable in this simple example
                        input.readOnly = false;
                        input.classList.remove('bg-light');
                    }
                    
                    // For demo purposes, also make password editable
                    if (input.id === 'password') {
                        input.readOnly = false;
                        input.classList.remove('bg-light');
                        input.value = ''; // Clear password field for security
                        input.placeholder = 'Enter new password';
                    }
                });
            }
    
            function disableEditMode() {
                isEditing = false;
                actionButton.textContent = 'Edit';
                
                // Remove blue border when returning to view mode
                formOuterContainer.classList.remove('edit-mode');
                
                formInputs.forEach(input => {
                    input.readOnly = true;
                    input.classList.add('bg-light');
                    
                    // Remove any validation styling
                    input.classList.remove('is-invalid');
                    
                    // Reset password field to dots
                    if (input.id === 'password') {
                        input.value = '••••••••••••';
                        input.placeholder = '';
                    }
                });
                
                // Clear error messages
                document.querySelectorAll('.invalid-feedback').forEach(elem => {
                    elem.textContent = '';
                });
            }
            
            function validateAndSubmit() {
                let isValid = true;
                
                // Clear all previous error messages
                document.querySelectorAll('.invalid-feedback').forEach(elem => {
                    elem.textContent = '';
                });
                document.querySelectorAll('.is-invalid').forEach(input => {
                    input.classList.remove('is-invalid');
                });
                
                // Validate first name (required)
                const firstName = document.getElementById('first_name');
                if (!firstName.value.trim()) {
                    showError(firstName, 'First name is required');
                    isValid = false;
                }
                
                // Validate last name (required)
                const lastName = document.getElementById('last_name');
                if (!lastName.value.trim()) {
                    showError(lastName, 'Last name is required');
                    isValid = false;
                }
                
                // Validate email (required and format)
                const email = document.getElementById('email');
                if (!email.value.trim()) {
                    showError(email, 'Email is required');
                    isValid = false;
                } else if (!isValidEmail(email.value)) {
                    showError(email, 'Incorrect email. Please ensure your email is in the correct format (name@sky.com)');
                    isValid = false;
                }
                
                // Validate username (required and unique)
                const username = document.getElementById('username');
                if (!username.value.trim()) {
                    showError(username, 'Username is required');
                    isValid = false;
                } else if (takenUsernames.includes(username.value.trim().toLowerCase())) {
                    // Check if username is already taken
                    showError(username, 'The username has already been taken. Please choose a different one.');
                    isValid = false;
                }
                
                // Validate password (if changed)
                const password = document.getElementById('password');
                if (password.value.trim() !== '' && password.value !== '••••••••••••') {
                    if (!isValidPassword(password.value)) {
                        showError(password, 'Incorrect password. It must have at least 8 characters that include at least 1 lowercase characters, 1 uppercase characters, 1 number and 1 special character');
                        isValid = false;
                    }
                }
                
                if (isValid) {
                    submitForm();
                }
            }
            
            function showError(inputElement, message) {
                inputElement.classList.add('is-invalid');
                const errorElement = document.getElementById(inputElement.id + '_error');
                errorElement.textContent = message;
            }
            
            function isValidEmail(email) {
                // This regex pattern checks for format similar to name@sky.com
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }
            
            function isValidPassword(password) {
                // Password must have at least 8 characters with 1 lowercase, 1 uppercase, 1 number, and 1 special character
                const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
                return passwordRegex.test(password);
            }
    
            function submitForm() {
                // Here you would normally collect the form data and send to the backend
                const formData = new FormData(form);
                
                // For demonstration purposes - showing the data that would be sent
                console.log('Form data to be submitted:');
                for (let [key, value] of formData.entries()) {
                    console.log(`${key}: ${value}`);
                }
                
                // This is where you would add the AJAX call to your backend
                // For now, just simulate a successful update
                alert('Profile updated successfully!');
                
                // Return to read-only state
                disableEditMode();
            }
        });
    </script>


    <footer class="mt-5">
        {% include 'footer.html' %}
    </footer>
</body>
</html>
