{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Sky Health Account</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'authentication.css'%}" rel="stylesheet">
</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>
    
    <main>
        <div class="container">
            <div class="loginImage">
                <img src="/static/img/loginImage.png" alt="Team working on computer">
            </div>
            <div class="accountForm">
                <h1 class="accountTitle">
                    Create your Sky Health account
                </h1>
                <div class="formLinks">
                    <a href="" class="loginLink">Login |</a>
                    <a href="" class="createLink">Create an account</a>
                </div>
                <form>
                    <input type="text" placeholder="First name">
                    <input type="text" placeholder="Last name">
                    <input type="email" placeholder="Email">
                    <input type="text" placeholder="Username">
                    <input type="password" placeholder="Create your password">
                    <button type="submit" class="continueButton">Continue</button>
                </form>
            </div>
        </div>
    </main>
    
    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
