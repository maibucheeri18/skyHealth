{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'authentication.css'%}" rel="stylesheet">
</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>

    <main>
        <div class="container">
            <div class="loginImage">
                <img src="/static/img/loginImage.png" alt="Team working on computer">
            </div>
            <div class="loginForm">
                <h1 class="loginTitle">
                    Login to your account
                </h1>
                <div class="formLinks">
                    <a href="{% url 'login' %}" class="loginLabel">Login   |</a> 
                    <a href="{% url 'create_account' %}">Create an account</a>
                </div>
                
                {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                    <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                        {{ message }}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="login-field">
                        {{ form.username }}
                    </div>
                    <div class="login-field">
                        {{ form.password }}
                    </div>
                    <div class="login-field">
                        <a href="{% url 'reset_password' %}" class="forgotPassword">Forgotten Password?</a>
                    </div>
                    <button type="submit" class="loginButton">Login</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
