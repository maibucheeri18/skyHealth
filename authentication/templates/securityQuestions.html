{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Questions</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'authentication.css'%}" rel="stylesheet">
</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>

    <main>
        <div class="container">
            <div class="loginImage">
                <img src="/static/img/loginImage.png" alt="Team working on computer">
            </div>
            <div class="securityForm">
                <h1 class="securityTitle">
                    Security questions
                </h1>
                <p class="securityDescription">
                    Please answer the following questions to verify your identity and reset your password.
                </p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="question-field">
                        <label for="id_city" class="question1">What is the name of the city you were born in?</label>
                        {{ form.city }}
                    </div>
                    
                    <div class="question-field">
                        <label for="id_company" class="question2">What is the name of the first company you worked for?</label>
                        {{ form.company }}
                    </div>
                    
                    <button type="submit" class="continueButton">Continue</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
