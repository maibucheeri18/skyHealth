{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Security Questions</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'authentication.css'%}" rel="stylesheet">
</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>
    
    <main>
        <div class="container">
            <div class="loginImage">
                <img src="/static/img/loginImage.png" alt="Team working on computer">
            </div>
            <div class="securityForm">
                <h1 class="securityTitle">
                    Security questions
                </h1>
                <p class="securityDescription">
                    If you forget your password, you will be prompted to answer security questions to verify your identity and reset it.
                </p>
                <form>
                    <div class="question-field">
                        <label for="city" class="questionLabel">What is the name of the city you were born in?</label>
                        <input type="text" id="city" placeholder="City">
                    </div>
                    <div class="question-field">
                        <label for="company" class="questionLabel">What is the name of the first company you worked for?</label>
                        <input type="text" id="company" placeholder="First job company">
                    </div>
                    <button type="submit" class="signupButton">Sign Up</button>
                </form>
            </div>
        </div>
    </main>
    
    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
