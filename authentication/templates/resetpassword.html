{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- webpage CSS -->
    <link href="{% static 'authentication.css'%}" rel="stylesheet">
</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>
    
    <main>
        <div class="container">
            <div class="loginImage">
                <img src="/static/img/loginImage.png" alt="Team working on computer">
            </div>
            <div class="resetForm">
                <h1 class="resetTitle">
                    Reset account password
                </h1>
                <p class="resetDescription">Enter a new password to reset your account and regain access.</p>
                <form>
                    <div class="password-field">
                        <label for="new-password" class="passwordLabel">Enter new password</label>
                        <input type="password" id="new-password" placeholder="New password">
                    </div>
                    <div class="password-field">
                        <label for="confirm-password" class="passwordLabel">Confirm new password</label>
                        <input type="password" id="confirm-password" placeholder="Confirm password">
                    </div>
                    <button type="submit" class="resetButton">Reset Password</button>
                </form>
            </div>
        </div>
    </main>
    
    <footer>
        {% include 'footer.html' %}
    </footer>
</body>
</html>
